name: Deploy Testing to Hostinger

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-testing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,xml,ctype,json,curl,dom,fileinfo,gd,intl,pdo,pdo_mysql,zip,opcache
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: acerapp/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Package application files
        run: |
          tar -czf /tmp/acerapp.tar.gz \
            --exclude='storage/logs/*' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.git' \
            --exclude='.github' \
            -C .. acerapp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acerapp-build
          path: /tmp/acerapp.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: testing

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: acerapp-build
          path: /tmp

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Test SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        
        run: |
          ssh -v \
            -o StrictHostKeyChecking=no \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "echo Connected"

      
      - name: Upload environment file
        env:
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          HOSTINGER_ENV_FILE: ${{ secrets.HOSTINGER_ENV_FILE }}
        run: |
          ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "mkdir -p '$HOSTINGER_APP_PATH'" && \
          printf '%s' "$HOSTINGER_ENV_FILE" | ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "cat > '$HOSTINGER_APP_PATH/.env'" && \
          ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "chmod 600 '$HOSTINGER_APP_PATH/.env'"


      - name: Upload application files
        env:
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}  
          
        run: |
          scp -P "$HOSTINGER_PORT" /tmp/acerapp.tar.gz "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/acerapp.tar.gz"
      
          ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "
            mkdir -p '$HOSTINGER_APP_PATH'
            tar -xzf /tmp/acerapp.tar.gz -C '$HOSTINGER_APP_PATH' --strip-components=1
      
            rm -rf '$HOSTINGER_PUBLIC_PATH'/*
            cp -a '$HOSTINGER_APP_PATH/public/.' '$HOSTINGER_PUBLIC_PATH/'
          "

      
      - name: Verify SSH access
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
        run: |
          ssh -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "cd '$HOSTINGER_APP_PATH' && pwd && ls -la .env && echo '---' && cd '$HOSTINGER_PUBLIC_PATH' && pwd && ls -la build"

