# GitLab CI/CD Configuration
# This file disables the default pipeline that uses herokuish

# Disable Auto DevOps
include: []

# Define stages
stages:
  - skip

# Minimal job that satisfies GitLab requirement but never runs
skip:
  stage: skip
  script:
    - echo "Pipeline disabled"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - when: never
